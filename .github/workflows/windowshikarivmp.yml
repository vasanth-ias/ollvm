name: Build Hikari Android AArch64 (LLVM 22 + LLD)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

env:
  LLVM_BRANCH: release/22.x
  HIKARI_REPO: https://github.com/PPKunOfficial/Hikari-fix.git

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja + Git
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          choco install ninja --no-progress -y

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_BRANCH }}
          path: llvm-project

      # ------------------------------------------------------------
      # Cache the LLVM build + install. First run: cold (2h).
      # Every subsequent run: warm (~5 min).
      # ------------------------------------------------------------
      - name: Cache LLVM build
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: |
            llvm-project/build
            llvm-project/llvm-install
          key: llvm22-aarch64-${{ runner.os }}-v1
          restore-keys: |
            llvm22-aarch64-${{ runner.os }}-

      - name: Configure LLVM (with LLD)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd llvm-project
          mkdir build
          cd build
          cmake -G Ninja ^
            -S ../llvm ^
            -B . ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang;lld" ^
            -DLLVM_TARGETS_TO_BUILD="AArch64" ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_BUILD_TOOLS=ON ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
            -DLLVM_PARALLEL_LINK_JOBS=2 ^
            -DCMAKE_INSTALL_PREFIX="%CD%\..\llvm-install"

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd llvm-project\build
          ninja clang lld opt llc llvm-ar llvm-ranlib llvm-objcopy llvm-strip llvm-nm llvm-readobj

      - name: Install LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd llvm-project\build
          ninja install

      - name: Verify cache hit
        shell: pwsh
        run: |
          if ("${{ steps.llvm-cache.outputs.cache-hit }}" -eq "true") {
            Write-Host "LLVM restored from cache — skipping rebuild"
          } else {
            Write-Host "LLVM built from source — cache will be saved"
          }

      - name: Clone Hikari-fix
        shell: pwsh
        run: git clone --depth=1 $env:HIKARI_REPO hikari-fix

      - name: Configure Hikari-fix
        shell: cmd
        run: |
          cd hikari-fix
          cmake -G Ninja -S . -B build ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON ^
            -DLT_LLVM_INSTALL_DIR="%CD%\..\llvm-project\llvm-install"

      - name: Build Hikari-fix plugin
        shell: cmd
        run: |
          cd hikari-fix
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage\bin"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\plugin" | Out-Null

          foreach ($exe in @("clang.exe","clang++.exe","clang-cl.exe","opt.exe","llc.exe","lld.exe","ld.lld.exe","llvm-ar.exe","llvm-ranlib.exe","llvm-objcopy.exe","llvm-strip.exe","llvm-nm.exe","llvm-readobj.exe")) {
            $p = "llvm-project\llvm-install\bin\$exe"
            if (Test-Path $p) { Copy-Item $p "$stage\bin\" }
          }

          $dll = Get-ChildItem -Path hikari-fix/build -Recurse -Include Hikari.dll,libHikari.dll | Select-Object -First 1
          if (-not $dll) { throw "Hikari.dll not found" }
          Copy-Item $dll.FullName "$stage\plugin\Hikari.dll"

          Compress-Archive -Path "$stage\*" -DestinationPath hikari-llvm22-android.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-llvm22-android
          path: hikari-llvm22-android.zip
          retention-days: 14

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hikari-llvm22-android.zip
          name: Hikari LLVM 22 Android AArch64
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
