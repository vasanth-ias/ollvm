name: Build Clang for Android AArch64

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

env:
  LLVM_BRANCH: release/22.x

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja + Git
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          choco install ninja --no-progress -y
          cmake --version
          ninja --version
          git --version

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_BRANCH }}
          path: llvm-project

      - name: Configure LLVM
        shell: cmd
        run: |
          cd llvm-project
          mkdir build
          cd build
          cmake -G Ninja ^
            -S ../llvm ^
            -B . ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang" ^
            -DLLVM_TARGETS_TO_BUILD="AArch64" ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_BUILD_TOOLS=ON ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
            -DLLVM_PARALLEL_LINK_JOBS=2 ^
            -DCMAKE_INSTALL_PREFIX="%CD%\..\llvm-install"

      - name: Build Clang
        shell: cmd
        run: |
          cd llvm-project\build
          ninja clang

      - name: Install LLVM
        shell: cmd
        run: |
          cd llvm-project\build
          ninja install

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage\bin" | Out-Null

          foreach ($exe in @("clang.exe","clang++.exe","clang-cl.exe","llvm-ar.exe","llvm-objcopy.exe","llvm-strip.exe","llvm-nm.exe","llvm-readobj.exe")) {
            $p = "llvm-project\llvm-install\bin\$exe"
            if (Test-Path $p) { Copy-Item $p "$stage\bin\" }
          }

          Compress-Archive -Path "$stage\*" -DestinationPath clang-android-aarch64-win-x64.zip -Force
          "ARCHIVE_PATH=$((Resolve-Path 'clang-android-aarch64-win-x64.zip').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-android-aarch64-win-x64
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 14

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          name: Clang for Android AArch64 (LLVM 22) Windows x64
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
