name: Build Hikari for Android AArch64 (Custom LLVM 22)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-ndk-*'

env:
  LLVM_BRANCH: release/22.x
  HIKARI_REPO: https://github.com/PPKunOfficial/Hikari-fix.git

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja + Git
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          choco install ninja --no-progress -y
          cmake --version
          ninja --version
          git --version

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_BRANCH }}
          path: llvm-project

      - name: Configure LLVM
        shell: cmd
        run: |
          cd llvm-project
          mkdir build
          cd build
          cmake -G Ninja ^
            -S ../llvm ^
            -B . ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang" ^
            -DLLVM_TARGETS_TO_BUILD="AArch64" ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_BUILD_TOOLS=ON ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
            -DLLVM_PARALLEL_LINK_JOBS=2 ^
            -DCMAKE_INSTALL_PREFIX="%CD%\..\llvm-install"

      - name: Build LLVM
        shell: cmd
        run: |
          cd llvm-project\build
          ninja opt clang llc

      - name: Install LLVM
        shell: cmd
        run: |
          cd llvm-project\build
          ninja install

      - name: Clone Hikari-fix
        shell: pwsh
        run: |
          git clone --depth=1 $env:HIKARI_REPO hikari-fix

      - name: Configure Hikari-fix
        shell: cmd
        run: |
          cd hikari-fix
          cmake -G Ninja -S . -B build ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON ^
            -DLT_LLVM_INSTALL_DIR="%CD%\..\llvm-project\llvm-install"

      - name: Build Hikari-fix plugin
        shell: cmd
        run: |
          cd hikari-fix
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage\bin"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\plugin" | Out-Null

          $dll = Get-ChildItem -Path hikari-fix/build -Recurse -Include Hikari.dll,libHikari.dll | Select-Object -First 1
          if (-not $dll) { throw "Hikari.dll not found" }
          Copy-Item $dll.FullName "$stage\plugin\Hikari.dll"

          foreach ($exe in @("opt.exe","clang.exe","clang++.exe","llc.exe")) {
            Copy-Item "llvm-project\llvm-install\bin\$exe" "$stage\bin\"
          }

          Compress-Archive -Path "$stage\*" -DestinationPath hikari-android-aarch64-win-x64.zip -Force
          "ARCHIVE_PATH=$((Resolve-Path 'hikari-android-aarch64-win-x64.zip').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-android-aarch64-win-x64
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 14

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          name: Hikari-fix for Android AArch64 (LLVM 22) Windows x64
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
