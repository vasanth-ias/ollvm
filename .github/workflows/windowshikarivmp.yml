name: Build Hikari for Android AArch64 (Custom LLVM 22)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-ndk-*'

env:
  LLVM_BRANCH: release/22.x
  HIKARI_REPO: https://github.com/PPKunOfficial/Hikari-fix.git
  ANDROID_TARGET: aarch64-linux-android21

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja + Git
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          choco install ninja --no-progress -y
          cmake --version
          ninja --version
          git --version

      - name: Checkout LLVM (release/22.x)
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_BRANCH }}
          path: llvm-project

      - name: Configure LLVM (Release, Ninja, AArch64 only)
        shell: cmd
        run: |
          cd llvm-project
          mkdir build
          cd build
          cmake -G Ninja ^
            -S ../llvm ^
            -B . ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang" ^
            -DLLVM_TARGETS_TO_BUILD="AArch64" ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_BUILD_TOOLS=ON ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
            -DLLVM_PARALLEL_LINK_JOBS=2 ^
            -DCMAKE_INSTALL_PREFIX="%CD%\..\llvm-install"

      - name: Build LLVM (opt, clang, llc)
        shell: cmd
        run: |
          cd llvm-project\build
          ninja opt clang llc

      - name: Install LLVM
        shell: cmd
        run: |
          cd llvm-project\build
          ninja install

      - name: Clone Hikari-fix
        shell: pwsh
        run: |
          git clone --depth=1 $env:HIKARI_REPO hikari-fix

      - name: Configure Hikari-fix
        shell: cmd
        run: |
          cd hikari-fix
          cmake -G Ninja -S . -B build ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON ^
            -DLT_LLVM_INSTALL_DIR="%CD%\..\llvm-project\llvm-install"

      - name: Build Hikari-fix plugin
        shell: cmd
        run: |
          cd hikari-fix
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage\bin"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\plugin" | Out-Null

          $dll = Get-ChildItem -Path hikari-fix/build -Recurse -Include Hikari.dll,libHikari.dll | Select-Object -First 1
          if (-not $dll) { throw "Hikari.dll not found" }
          Copy-Item $dll.FullName "$stage\plugin\Hikari.dll"

          foreach ($exe in @("opt.exe","clang.exe","clang++.exe","llc.exe")) {
            Copy-Item "llvm-project\llvm-install\bin\$exe" "$stage\bin\"
          }

          @"
Hikari-fix for Android AArch64 (LLVM 22, Windows x64)
=====================================================
Custom LLVM 22 toolchain with Hikari plugin, built for AArch64 (ARM64) only.
Use these tools in Android Studio instead of the NDK's built-in LLVM.

Contents:
  plugin\Hikari.dll             -> the pass plugin
  bin\opt.exe, clang.exe, llc.exe -> LLVM 22 tools (AArch64 target only)

Android Studio / CMake integration (arm64-v8a only):

  set(CMAKE_C_COMPILER   "C:/path/to/bin/clang.exe")
  set(CMAKE_CXX_COMPILER "C:/path/to/bin/clang++.exe")
  set(CMAKE_SYSROOT "C:/Android/Sdk/ndk/<version>/toolchains/llvm/prebuilt/windows-x86_64/sysroot")
  set(CMAKE_C_FLAGS   "--target=$env:ANDROID_TARGET")
  set(CMAKE_CXX_FLAGS "--target=$env:ANDROID_TARGET")

Manual obfuscation pipeline (arm64-v8a):

  bin\clang.exe --target=$env:ANDROID_TARGET -O0 -emit-llvm -c input.c -o input.bc
  bin\opt.exe -load-pass-plugin="plugin\Hikari.dll" --passes="hikari(enable-bcfobf,enable-cffobf,enable-strcry)" input.bc -o output.bc
  bin\llc.exe -mtriple=aarch64-linux-android21 -filetype=obj output.bc -o output.o

Flags that work for C++ on Android AArch64:
  enable-bcfobf, enable-cffobf, enable-splitobf, enable-subobf,
  enable-strcry, enable-constenc, enable-indibran, enable-fco,
  enable-vmp        (limited IR support: no varargs, exceptions, floats, vectors)
  enable-antihook   (AArch64 only - works here)
  enable-allobf     (bcf + cff + sub + split + strcry + indibran + fco)

Note: enable-antihook is specifically an AArch64 pass, so it is now usable
since we built only the AArch64 backend.
"@ | Out-File -Encoding ascii "$stage\README-ANDROID-AARCH64.txt"

          Compress-Archive -Path "$stage\*" -DestinationPath hikari-android-aarch64-win-x64.zip -Force
          "ARCHIVE_PATH=$((Resolve-Path 'hikari-android-aarch64-win-x64.zip').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-android-aarch64-win-x64
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 14

      - name: Upload release asset (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          name: Hikari-fix for Android AArch64 (LLVM 22) Windows x64
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
