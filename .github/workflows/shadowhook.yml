name: Build libshadowhook.a + libshadowhook_nothing.so (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-shadowhook.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===================================================================
      # Install CMake 4.0.3 MANUALLY and force it to the front of PATH.
      # (lukka/get-cmake installs it but the runner's preinstalled 3.22.6
      # still wins because it sits earlier in PATH.)
      # ===================================================================
      - name: Install CMake 4.0.3 (manual, forced PATH)
        run: |
          set -e
          wget -q https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-linux-x86_64.tar.gz
          tar -xzf cmake-4.0.3-linux-x86_64.tar.gz -C /opt
          echo "/opt/cmake-4.0.3-linux-x86_64/bin" >> $GITHUB_PATH
          # also export for the rest of THIS step
          export PATH="/opt/cmake-4.0.3-linux-x86_64/bin:$PATH"
          echo "cmake version: $(cmake --version | head -n1)"
          which cmake

      # ===================================================================
      # Verify CMake 4.x is actually the one being used from now on
      # ===================================================================
      - name: Verify CMake
        run: |
          which cmake
          cmake --version

      # ===================================================================
      # Download Android NDK r25c
      # ===================================================================
      - name: Download Android NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_DIR=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      # ===================================================================
      # Clone ShadowHook source (v2.0.1)
      # ===================================================================
      - name: Clone ShadowHook source (v2.0.1)
        run: |
          git clone --depth 1 --branch v2.0.1 \
            https://github.com/bytedance/android-inline-hook.git shadowhook-src
          echo "--- CMakeLists locations ---"
          find shadowhook-src/shadowhook/src/main/cpp -name "CMakeLists.txt"

      # ===================================================================
      # PATCH: relax warnings, make MAIN lib static.
      # shadowhook_nothing MUST stay SHARED (it is dlopen()ed at runtime).
      # ===================================================================
      - name: Patch ShadowHook CMakeLists.txt
        run: |
          set -e
          CM_FILE="shadowhook-src/shadowhook/src/main/cpp/CMakeLists.txt"
          echo "=== BEFORE ==="
          grep -n "add_library\|target_compile_options\|add_subdirectory" "$CM_FILE" || true

          sed -i 's/-Weverything -Werror//g' "$CM_FILE"
          sed -i 's/add_library(${TARGET} SHARED ${SRC})/add_library(${TARGET} STATIC ${SRC})/g' "$CM_FILE"

          echo "=== AFTER ==="
          grep -n "add_library\|target_compile_options\|add_subdirectory" "$CM_FILE" || true

      # ===================================================================
      # Build EVERYTHING
      # ===================================================================
      - name: Build ShadowHook (static + nothing)
        run: |
          set -e
          # Force CMake 4.0.3 to the front of PATH for this step too.
          export PATH="/opt/cmake-4.0.3-linux-x86_64/bin:$PATH"
          echo "Using: $(which cmake) — $(cmake --version | head -n1)"

          export NDK_DIR=$(pwd)/android-ndk-r25c
          TOOLCHAIN="$NDK_DIR/build/cmake/android.toolchain.cmake"

          cmake -S shadowhook-src/shadowhook/src/main/cpp \
                -B shadowhook-build \
                -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_BUILD_TYPE=Release

          # Build ALL targets (do NOT pass --target)
          cmake --build shadowhook-build -j$(nproc)

          echo "=== All built libs ==="
          find shadowhook-build \( -name "*.so" -o -name "*.a" \) -print

          SHADOWHOOK_A=$(find shadowhook-build -name "libshadowhook.a" | head -n1)
          SHADOWHOOK_NOTHING_SO=$(find shadowhook-build -name "libshadowhook_nothing.so" | head -n1)

          if [ -z "$SHADOWHOOK_A" ]; then
            echo "ERROR: libshadowhook.a not found"; exit 1
          fi
          if [ -z "$SHADOWHOOK_NOTHING_SO" ]; then
            echo "ERROR: libshadowhook_nothing.so not found"
            find shadowhook-build -iname "*nothing*" || true
            exit 1
          fi

          echo "Static  lib : $SHADOWHOOK_A"
          echo "Nothing lib : $SHADOWHOOK_NOTHING_SO"

          mkdir -p output
          cp "$SHADOWHOOK_A"          output/libshadowhook.a
          cp "$SHADOWHOOK_NOTHING_SO" output/libshadowhook_nothing.so

          echo "=== output/ ==="
          ls -lh output/

      # ===================================================================
      # Stage headers
      # ===================================================================
      - name: Stage headers
        run: |
          set -e
          mkdir -p output/include
          find shadowhook-src/shadowhook/src/main/cpp/include -name "*.h" \
            -exec cp {} output/include/ \;
          echo "=== headers ==="
          ls -lh output/include/

      # ===================================================================
      # Upload artifacts
      # ===================================================================
      - name: Upload libshadowhook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libshadowhook-static-arm64
          path: |
            output/libshadowhook.a
            output/libshadowhook_nothing.so
            output/include/*.h
          if-no-files-found: error
