name: Check Runner Specs

on:
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - name: Print system information
        run: |
          echo "=== CPU Info ==="
          lscpu
          echo ""
          echo "=== Number of cores (nproc) ==="
          nproc
          echo ""
          echo "=== Memory (free -h) ==="
          free -h
          echo ""
          echo "=== Disk Space (df -h) ==="
          df -h
          echo ""
          echo "=== OS Release ==="
          cat /etc/os-release
