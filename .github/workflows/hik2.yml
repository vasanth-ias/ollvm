name: Build Equati0n Hikari-LLVM15.0.2 (AArch64) with clang and lld

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build gcc g++ python3 libz3-dev ccache binutils-gold

      - name: Clone Equati0n/Hikari-LLVM15.0.2
        run: |
          git clone --recursive https://github.com/Equati0n/Hikari-LLVM15.0.2.git hikari

      - name: Configure LLVM with Hikari (full power)
        run: |
          cd hikari
          mkdir -p build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_PARALLEL_COMPILE_JOBS=4 \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_USE_LINKER=gold \
            -DLLVM_CCACHE_BUILD=ON \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/../install" \
            ../llvm

      - name: Build clang and lld
        run: |
          cd hikari/build
          ninja -j4 clang lld

      - name: Install clang, lld, libraries, and headers
        run: |
          cd hikari/build
          ninja install-clang
          ninja install-lld
          ninja install-llvm-libraries
          ninja install-llvm-headers

      - name: Package installation
        run: |
          cd hikari/install
          tar -czf hikari-llvm15.0.2-aarch64.tar.gz *
          echo "ARTIFACT_PATH=$(pwd)/hikari-llvm15.0.2-aarch64.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-llvm15.0.2-aarch64
          path: ${{ env.ARTIFACT_PATH }}
