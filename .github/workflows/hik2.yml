name: Build Hikari-LLVM (AArch64 Target Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3 libssl-dev

      - name: Checkout Hikari-LLVM
        uses: actions/checkout@v4
        with:
          repository: 'Equati0n/Hikari-LLVM15.0.2'
          ref: 'main'

      - name: Configure and Build LLVM / Clang
        run: |
          mkdir build
          mkdir install
          cd build
          
          # Target strictly AArch64 to maximize build speed
          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF
          
          ninja install

      - name: Package Toolchain
        run: |
          tar -czvf hikari-llvm15-aarch64-linux-x86_64.tar.gz -C install .

      - name: Upload Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-llvm15-aarch64-linux-x86_64
          path: hikari-llvm15-aarch64-linux-x86_64.tar.gz
