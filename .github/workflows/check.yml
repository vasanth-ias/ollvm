name: Build Equati0n Hikari-LLVM15 (AArch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build gcc g++ python3 libz3-dev

      - name: Clone Equati0n/Hikari-LLVM15
        run: |
          git clone --recursive https://github.com/Equati0n/Hikari-LLVM15.git hikari
          cd hikari
          echo "Top-level contents:"
          ls -la
          echo "Contents of llvm/ (if exists):"
          ls -la llvm 2>/dev/null || echo "llvm/ not found"

      - name: Verify advanced flags exist in source
        run: |
          cd hikari
          echo "Searching for junk assembly and other advanced flags..."
          FLAGS=(
            "bcf_junkasm"
            "bcf_junkasm_minnum"
            "bcf_junkasm_maxnum"
            "enable-constenc"
            "indibran-enc-jump-target"
          )
          for flag in "${FLAGS[@]}"; do
            if grep -rq "$flag" . ; then
              echo "Found: $flag"
            else
              echo "ERROR: Flag '$flag' not found in source code!"
              exit 1
            fi
          done
          echo "All required advanced flags are present."

      - name: Determine LLVM source directory
        id: llvm_src
        run: |
          cd hikari
          if [ -f "CMakeLists.txt" ] && [ -d "llvm" ]; then
            echo "LLVM source is in 'llvm' subdirectory"
            echo "src_dir=llvm" >> $GITHUB_OUTPUT
          elif [ -f "CMakeLists.txt" ]; then
            echo "LLVM source is in repository root"
            echo "src_dir=." >> $GITHUB_OUTPUT
          else
            echo "Could not determine LLVM source directory"
            exit 1
          fi

      - name: Configure and build LLVM with Hikari
        run: |
          cd hikari
          mkdir -p build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/../install" \
            ../${{ steps.llvm_src.outputs.src_dir }}
          ninja -j$(nproc)
          ninja install

      - name: Package installation
        run: |
          cd hikari/install
          tar -czf hikari-eq-aarch64.tar.gz *
          echo "ARTIFACT_PATH=$(pwd)/hikari-eq-aarch64.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-eq-aarch64
          path: ${{ env.ARTIFACT_PATH }}
