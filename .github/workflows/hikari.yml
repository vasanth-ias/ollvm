name: Build Hikari-LLVM15.0.2 Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build gcc g++ python3 libz3-dev binutils-gold

      - name: Clone nkhmelni/Hikari-LLVM (llvm-15.0.2)
        run: |
          git clone --recursive -b llvm-15.0.2 https://github.com/nkhmelni/Hikari-LLVM.git hikari

      - name: Build clang with AArch64 support
        run: |
          cd hikari
          mkdir -p build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_PARALLEL_COMPILE_JOBS=4 \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_USE_LINKER=gold \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/../install" \
            ../llvm
          ninja clang
          ninja install-clang

      - name: Package toolchain (tar.gz preserves symlinks)
        run: |
          cd hikari/install
          tar -czf hikari-llvm15.0.2-aarch64.tar.gz *
          echo "ARCHIVE_PATH=$(pwd)/hikari-llvm15.0.2-aarch64.tar.gz" >> $GITHUB_ENV

      - name: Upload as release asset (or artifact)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          tag_name: hikari-toolchain
          name: Hikari LLVM15.0.2 Toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
